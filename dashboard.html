<!DOCTYPE html>
<html>
<head>
  <title>AquaIntel Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/auth-check.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #0d1b2a; color: #e0e6ed; }
    header { background: #12233b; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f3a5f; position: sticky; top: 0; z-index: 10; }
    header .title { padding: 18px 0; }
    header h1 { margin: 0; font-size: 22px; color: #4fc3f7; }
    header p { margin: 4px 0 0; color: #7a92ab; font-size: 13px; }
    nav { display: flex; gap: 10px; align-items: center; }
    nav span { color: #b0c4de; cursor: pointer; font-size: 14px; padding: 9px 16px; border-radius: 6px; user-select: none; }
    nav span.active { background: #4fc3f7; color: #0d1b2a; font-weight: 600; }
    nav span:hover:not(.active) { background: #1f3a5f; }
    nav button { background: #e74c3c; color: white; border: none; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    nav button:hover { background: #c0392b; }

    .container { padding: 30px 40px; }
    .summary { display: flex; gap: 20px; margin-bottom: 25px; }
    .card { background: #12233b; border-radius: 12px; padding: 20px; flex: 1; border: 1px solid #1f3a5f; text-align: center; }
    .card h2 { margin: 0; font-size: 30px; color: #4fc3f7; }
    .card p { margin: 5px 0 0; color: #7a92ab; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

    .simulate-box { background: #12233b; border: 1px solid #1f3a5f; border-radius: 12px; padding: 18px 20px; margin-bottom: 25px; display: flex; gap: 14px; align-items: center; }
    .simulate-box button { background: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .simulate-box button.stop { background: #e74c3c; }
    .simulate-box p { margin: 0; color: #7a92ab; font-size: 13px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .chart-box { background: #12233b; border: 1px solid #1f3a5f; border-radius: 12px; padding: 20px; }
    .chart-box h3 { margin: 0 0 15px; color: #4fc3f7; font-size: 15px; }

    @media (max-width: 768px) {
      header { flex-direction: column; align-items: flex-start; padding: 15px 20px; }
      nav { flex-wrap: wrap; margin-top: 10px; }
      .container { padding: 15px 20px; }
      .summary { flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .simulate-box { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <h1>💧 AquaIntel</h1>
      <p>Real-time operations dashboard</p>
    </div>
    <nav>
      <span class="active" onclick="goTo('/dashboard')">Dashboard</span>
      <span onclick="goTo('/assets-page')">Assets</span>
      <span onclick="goTo('/alerts-page')">Alerts</span>
      <button onclick="logout()">Log Out</button>
    </nav>
  </header>

  <div class="container">
    <div class="summary">
      <div class="card"><h2 id="asset-count">0</h2><p>Assets</p></div>
      <div class="card"><h2 id="reading-count">0</h2><p>Telemetry Readings</p></div>
      <div class="card"><h2 id="alert-count">0</h2><p>Active Alerts</p></div>
    </div>

    <div class="simulate-box">
      <button id="sim-btn" onclick="toggleSimulation()">▶ Start Live Simulation</button>
      <p>Generates a random pressure reading for Asset 1 every 3 seconds (great for demos)</p>
    </div>

    <div class="grid">
      <div class="chart-box">
        <h3>Sensor Readings Over Time</h3>
        <canvas id="lineChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Asset Status Breakdown</h3>
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <div class="chart-box" style="margin-top:20px;">
      <h3>Recent Activity</h3>
      <ul id="activity-list" style="list-style:none; padding:0; margin:0; max-height:250px; overflow-y:auto;"></ul>
    </div>
  </div>

  <script>
    requireLogin();
    startAlertWatcher();
    let lineChart, pieChart, simInterval = null;

    async function loadAssets() {
      const res = await fetch(API + "/assets");
      const assets = await res.json();
      document.getElementById("asset-count").textContent = assets.length;
      updatePieChart(assets);
    }

    async function loadTelemetry() {
      const res = await fetch(API + "/telemetry");
      const readings = await res.json();
      document.getElementById("reading-count").textContent = readings.length;
      updateLineChart(readings.slice(-15));
    }

    async function loadAlerts() {
      const res = await fetch(API + "/alerts");
      const alerts = await res.json();
      document.getElementById("alert-count").textContent = alerts.length;
    }

    async function loadActivity() {
      const res = await fetch(API + "/activity");
      const events = await res.json();
      const list = document.getElementById("activity-list");
      list.innerHTML = "";

      if (events.length === 0) {
        list.innerHTML = `<li style="color:#7a92ab; font-style:italic; padding:8px 0;">No activity yet</li>`;
        return;
      }

      events.forEach(e => {
        const color = e.type === "alert" ? "#e74c3c" : "#4fc3f7";
        const time = new Date(e.time).toLocaleTimeString();
        list.innerHTML += `<li style="padding:8px 0; border-bottom:1px solid #1f3a5f; font-size:13px;">
          <span style="color:${color}; font-weight:600;">●</span> ${e.text}
          <span style="color:#7a92ab; float:right;">${time}</span>
        </li>`;
      });
    }

    function updateLineChart(readings) {
      const labels = readings.map(r => new Date(r.recorded_at).toLocaleTimeString());
      const values = readings.map(r => r.value);
      if (lineChart) {
        lineChart.data.labels = labels;
        lineChart.data.datasets[0].data = values;
        lineChart.update();
        return;
      }
      lineChart = new Chart(document.getElementById("lineChart"), {
        type: "line",
        data: { labels, datasets: [{ label: "Sensor Value", data: values, borderColor: "#4fc3f7", backgroundColor: "rgba(79,195,247,0.15)", fill: true, tension: 0.3 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#7a92ab" } }, y: { ticks: { color: "#7a92ab" } } } }
      });
    }

    function updatePieChart(assets) {
      const activeCount = assets.filter(a => a.status === "active").length;
      const otherCount = assets.length - activeCount;
      if (pieChart) {
        pieChart.data.datasets[0].data = [activeCount, otherCount];
        pieChart.update();
        return;
      }
      pieChart = new Chart(document.getElementById("pieChart"), {
        type: "doughnut",
        data: { labels: ["Active", "Other"], datasets: [{ data: [activeCount, otherCount], backgroundColor: ["#27ae60", "#e67e22"] }] },
        options: { responsive: true, plugins: { legend: { labels: { color: "#e0e6ed" } } } }
      });
    }

    async function sendFakeReading() {
      const value = (30 + Math.random() * 50).toFixed(1);
      await fetch(`${API}/telemetry?asset_id=1&reading_type=pressure&value=${value}`, { method: "POST" });
      loadAll();
    }

    function toggleSimulation() {
      const btn = document.getElementById("sim-btn");
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
        btn.textContent = "▶ Start Live Simulation";
        btn.classList.remove("stop");
      } else {
        simInterval = setInterval(sendFakeReading, 3000);
        btn.textContent = "■ Stop Live Simulation";
        btn.classList.add("stop");
      }
    }

    function loadAll() { loadAssets(); loadTelemetry(); loadAlerts(); loadActivity(); }
    loadAll();
    setInterval(loadAll, 5000);
  </script>
</body>
</html>
