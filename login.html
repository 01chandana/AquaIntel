<!DOCTYPE html>
<html>
<head>
  <title>AquaIntel - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d1b2a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #12233b; border: 1px solid #1f3a5f; padding: 40px; border-radius: 10px; width: 320px; }
    .box h1 { color: #4fc3f7; font-size: 20px; margin-bottom: 20px; text-align: center; }
    input, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #1f3a5f; border-radius: 6px; font-size: 14px; background: #0d1b2a; color: #e0e6ed; }
    button { width: 100%; padding: 10px; background: #4fc3f7; color: #0d1b2a; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
    button:hover { background: #3ba8db; }
    .toggle { text-align: center; margin-top: 12px; font-size: 13px; }
    .toggle a { color: #4fc3f7; cursor: pointer; text-decoration: underline; }
    .msg { text-align: center; color: #e74c3c; font-size: 13px; margin-top: 10px; }
    #role-row { display: block; }
    @media (max-width: 480px) {
      .box { width: 90%; padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>💧 AquaIntel Login</h1>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <div id="role-row" style="display:block; color:#7a92ab; font-size:12px; margin-bottom:12px;">New accounts are Viewer (read-only). Admins are created securely from the server.</div>
    <button id="main-btn" onclick="login()">Log In</button>
    <div class="toggle"><a onclick="toggleMode()" id="toggle-link">Don't have an account? Sign up</a></div>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const API = window.location.origin;
    let mode = "login";

    function showMessage(message, ok=false) {
      const el = document.getElementById("msg");
      el.style.color = ok ? "#27ae60" : "#e74c3c";
      el.textContent = message;
    }

    function toggleMode() {
      mode = mode === "login" ? "signup" : "login";
      document.getElementById("main-btn").textContent = mode === "signup" ? "Sign Up" : "Log In";
      document.getElementById("main-btn").onclick = mode === "signup" ? signup : login;
      document.getElementById("toggle-link").textContent = mode === "signup" ? "Already have an account? Log in" : "Don't have an account? Sign up";
      showMessage("");
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch(`${API}/login`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Login failed");
        localStorage.setItem("token", data.access_token);
        localStorage.setItem("email", email.toLowerCase());
        localStorage.setItem("role", data.role);
        window.location.href = "/dashboard";
      } catch (e) { showMessage(e.message); }
    }

    async function signup() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const res = await fetch(`${API}/signup`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Signup failed");
        showMessage("Viewer account created. You can now log in.", true);
        document.getElementById("password").value = "";
        mode = "signup";
      } catch (e) { showMessage(e.message); }
    }

    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") (mode === "signup" ? signup : login)();
    });
  </script>
</body>
</html>
